<div class="shell" [class.shell--sidebar-open]="sidebarOpen()">
  <aside class="shell__sidebar" aria-label="Main navigation">
    <div class="shell__brand">
      <div class="shell__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 3L5 6v5c0 4.55 3.06 8.78 7 10 3.94-1.22 7-5.45 7-10V6l-7-3z"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div class="shell__brand-text">
        <span class="shell__brand-title">NDDES / NDFA</span>
        <span class="shell__brand-sub">Training Portal</span>
      </div>
    </div>

    <p class="shell__nav-label">Navigation</p>
    <nav class="shell__nav">
      <a
        routerLink="/dashboard"
        routerLinkActive="is-active"
        class="shell__nav-link"
        (click)="closeSidebar()"
      >
        <span class="shell__nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
        </span>
        Dashboard
      </a>
      <a
        routerLink="/courses"
        routerLinkActive="is-active"
        class="shell__nav-link"
        (click)="closeSidebar()"
      >
        <span class="shell__nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 016.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" />
          </svg>
        </span>
        Courses
      </a>
      <a
        routerLink="/events"
        routerLinkActive="is-active"
        class="shell__nav-link"
        (click)="closeSidebar()"
      >
        <span class="shell__nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
        </span>
        Events
      </a>
      <a
        routerLink="/my-training"
        routerLinkActive="is-active"
        class="shell__nav-link"
        (click)="closeSidebar()"
      >
        <span class="shell__nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2" />
            <path d="M9 5a2 2 0 012-2h2a2 2 0 012 2v0a2 2 0 01-2 2h-2a2 2 0 01-2-2v0z" />
            <path d="M9 12h6M9 16h6" />
          </svg>
        </span>
        My Training
      </a>
    </nav>

    <p class="shell__footer">v1.0 - NDDES/NDFA LMS</p>
  </aside>

  @if (sidebarOpen()) {
    <button
      type="button"
      class="shell__backdrop"
      aria-label="Close menu"
      (click)="closeSidebar()"
    ></button>
  }

  <div class="shell__main">
    <header class="shell__header">
      <button
        type="button"
        class="shell__menu-btn"
        aria-label="Toggle sidebar"
        (click)="toggleSidebar()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <div class="shell__header-actions">
        @if (user(); as u) {
          <div class="shell__user">
            <p class="shell__user-name">{{ u.fullName }}</p>
            <p class="shell__user-role">{{ u.role }}</p>
          </div>
        }
        <button type="button" class="shell__icon-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 01-3.46 0" />
          </svg>
        </button>
        <button type="button" class="shell__avatar" aria-label="Account">
          @if (user(); as u) {
            <span class="shell__avatar-inner" [title]="u.email">{{ userInitials() }}</span>
          } @else {
            <span class="shell__avatar-inner">U</span>
          }
        </button>
      </div>
    </header>

    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
